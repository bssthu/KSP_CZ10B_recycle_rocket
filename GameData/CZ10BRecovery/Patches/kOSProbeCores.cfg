// The recovery controller needs to remain on the booster after staging.
// This patch makes stock probe cores scriptable when kOS is installed, avoiding
// an extra computer part and making root-part selection easier.
@PART[probeCoreOcto2,probeCoreHex_v2,probeStackSmall,probeStackLarge]:NEEDS[kOS]
{
    MODULE
    {
        name = kOSProcessor
        diskSpace = 50000
        ECPerBytePerSecond = 0.0000001
        ECPerInstruction = 0.000004
    }
}

@PART[CZ10B-DemoBooster]:NEEDS[kOS]
{
    MODULE
    {
        name = kOSProcessor
        diskSpace = 50000
        ECPerBytePerSecond = 0.0000001
        ECPerInstruction = 0.000004
        bootFile = boot/cz10b-boot.ks
    }
}

// The upper stage waits passively while attached, then owns its own 100 km
// insertion after separation so the recovery computer can remain on stage one.
@PART[CZ10B-DemoUpperStage]:NEEDS[kOS]
{
    MODULE
    {
        name = kOSProcessor
        diskSpace = 50000
        ECPerBytePerSecond = 0.0000001
        ECPerInstruction = 0.000004
        bootFile = boot/cz10b-upper-boot.ks
    }
}

// A dedicated clone keeps the normal two-stage mission boot sequence intact
// while allowing the acceptance rig to start directly in powered descent.
+PART[CZ10B-DemoBooster]:NEEDS[kOS]
{
    @name = CZ10B-HoverTestBooster
    @title = CZ-10B kOS Hover-Test Booster
    @description = Complete reusable first stage configured to boot directly into the low-altitude cable-net recovery acceptance controller.
    @tags = reusable booster hover powered descent recovery kos cz10b test
    !MODULE[kOSProcessor],* { }
    MODULE
    {
        name = kOSProcessor
        diskSpace = 50000
        ECPerBytePerSecond = 0.0000001
        ECPerInstruction = 0.000004
        bootFile = boot/cz10b-hover-boot.ks
    }
}
