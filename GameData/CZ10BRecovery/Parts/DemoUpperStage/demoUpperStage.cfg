PART
{
    name = CZ10B-DemoUpperStage
    module = Part
    author = KSP Recycle Rocket Project
    MODEL
    {
        model = Squad/Parts/FuelTank/RockomaxTanks/Assets/Rockomax16
    }
    MODEL
    {
        model = Squad/Parts/Engine/liquidEnginePoodle_v2/LqdEnginePoodle_v2
        position = 0, -0.92, 0
    }
    MODEL
    {
        model = Squad/Parts/Command/probeStackLarge/model
        position = 0, 1.11, 0
    }
    // Stock Protective Rocket Nose Cone Mk7 geometry closes the previously flat
    // upper stage without adding another guidance or staging component.
    MODEL
    {
        model = Squad/Parts/Aero/cones/Assets/rocketNoseCone_v3
        position = 0, 1.30, 0
    }
    rescaleFactor = 1
    node_stack_top = 0, 1.30, 0, 0, 1, 0, 2
    node_stack_bottom = 0, -2.42, 0, 0, -1, 0, 2
    TechRequired = heavyRocketry
    entryCost = 18000
    cost = 7500
    category = Pods
    subcategory = 0
    title = CZ-10B Integrated Demonstration Upper Stage
    manufacturer = Recovery Systems Laboratory
    description = A compact autonomous upper stage for the recovery demonstration, finished with stock Protective Rocket Nose Cone Mk7 geometry. Attach its bottom node to the first-stage top node and place its engine in the separation stage.
    attachRules = 1,0,1,1,0
    CrewCapacity = 0
    vesselType = Probe
    mass = 2.5
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 15
    breakingForce = 300
    breakingTorque = 300
    maxTemp = 2200
    bulkheadProfiles = size2
    tags = upper second stage probe cz10b integrated

    fx_exhaustFlame_blue_small = 0, -2.2, 0, 0, 1, 0, running
    sound_vent_medium = engage
    sound_rocket_hard = running
    sound_vent_soft = disengage
    sound_explosion_low = flameout

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.03
        }
    }
    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 20
        YawTorque = 20
        RollTorque = 10
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.5
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }
    MODULE
    {
        name = ModuleEngines
        thrustVectorTransformName = thrustTransform
        exhaustDamage = True
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 250
        heatProduction = 80
        EngineType = LiquidFuel
        PROPELLANT
        {
            name = LiquidFuel
            ratio = 0.9
            DrawGauge = True
        }
        PROPELLANT
        {
            name = Oxidizer
            ratio = 1.1
        }
        atmosphereCurve
        {
            key = 0 350
            key = 1 120
            key = 3 0.001
        }
    }
    MODULE
    {
        name = ModuleGimbal
        gimbalTransformName = Gimbal
        gimbalRange = 6
    }
    RESOURCE
    {
        name = LiquidFuel
        amount = 720
        maxAmount = 720
    }
    RESOURCE
    {
        name = Oxidizer
        amount = 880
        maxAmount = 880
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 400
        maxAmount = 400
    }
}
