PART
{
    name = CZ10B-GridFin
    module = Part
    author = KSP Recycle Rocket Project
    MODEL
    {
        model = Squad/Parts/Aero/airbrake/Airbrake
    }
    rescaleFactor = 1
    node_attach = 0.0, 0.0, -0.025, 0.0, 0.0, 1.0, 1
    TechRequired = advAerodynamics
    entryCost = 20000
    cost = 1000
    category = Aero
    subcategory = 0
    title = CZ-10B Deployable Grid-Fin Analogue
    manufacturer = Recovery Systems Laboratory
    description = An aerodynamic steering panel used in four-fold symmetry on the reusable first stage. Its small low-drag control deflection supplies high-dynamic-pressure authority without acting as a speed brake.
    attachRules = 0,1,0,0,1
    mass = 0.05
    thermalMassModifier = 5.0
    emissiveConstant = 0.4
    dragModelType = none
    maximum_drag = 0.02
    minimum_drag = 0.02
    angularDrag = 2
    crashTolerance = 12
    maxTemp = 2400
    explosionPotential = 0.1
    fuelCrossFeed = True
    bulkheadProfiles = srf
    tags = cz10b grid fin airbrake recovery control surface

    MODULE
    {
        name = ModuleControlSurface
        useInternalDragModel = True
        dragCoeff = 0.25
        // Equivalent to four small AV-R8-class control surfaces.  Run 11
        // demonstrated that deploying four 70-degree ModuleAeroSurface panels
        // erased roughly 23 km of downrange travel, so these must steer by
        // symmetric control deflection rather than by opening as airbrakes.
        // Run 22 used only the low flight-wheel authority, so 0.42 could not
        // follow the 70--83 degree terminal request by itself.  The terminal
        // controller now enables the separately bounded 5% reaction-wheel
        // authority after entry cutoff.  Run 25 identified 15--23 m/s^2 of
        // upward aerodynamic acceleration during the 75% main burn with 0.65;
        // that lift stopped the descent near 6.5 km.  Restore 0.42 to retain
        // physical grid-fin steering without making its side force dominate
        // the solved thrust trajectory.
        deflectionLiftCoeff = 0.42
        ctrlSurfaceRange = 25
        ctrlSurfaceArea = 1
        actuatorSpeed = 30
        transformName = Flap
    }

    MODULE
    {
        name = ModuleGridFinAuthority
        fullLiftCoefficient = 0.42
        liftAuthorityPercent = 100
    }

    MODULE
    {
        name = FXModuleLookAtConstraint
        CONSTRAINLOOKFX
        {
            targetName = PistonArm
            rotatorsName = PistonBase
        }
        CONSTRAINLOOKFX
        {
            targetName = PistonBase
            rotatorsName = PistonArm
        }
    }
}
