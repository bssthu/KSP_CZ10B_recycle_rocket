PART
{
    name = CZ10B-GridFin
    module = Part
    author = KSP Recycle Rocket Project
    MODEL
    {
        model = Squad/Parts/Aero/airbrake/Airbrake
    }
    rescaleFactor = 1
    node_attach = 0.0, 0.0, -0.025, 0.0, 0.0, 1.0, 1
    TechRequired = advAerodynamics
    entryCost = 20000
    cost = 1000
    category = Aero
    subcategory = 0
    title = CZ-10B Deployable Grid-Fin Analogue
    manufacturer = Recovery Systems Laboratory
    description = An aerodynamic steering panel used in four-fold symmetry on the reusable first stage. Its small low-drag control deflection supplies high-dynamic-pressure authority without acting as a speed brake.
    attachRules = 0,1,0,0,1
    mass = 0.05
    thermalMassModifier = 5.0
    emissiveConstant = 0.4
    dragModelType = none
    maximum_drag = 0.02
    minimum_drag = 0.02
    angularDrag = 2
    crashTolerance = 12
    maxTemp = 2400
    explosionPotential = 0.1
    fuelCrossFeed = True
    bulkheadProfiles = srf
    tags = cz10b grid fin airbrake recovery control surface

    MODULE
    {
        name = ModuleAeroSurface
        useInternalDragModel = True
        dragCoeff = 0.6
        // Run 13 supplies the recovered full-deployment force reference for
        // this exact stock airbrake geometry.  A 35.714% steering limiter keeps
        // the former 25-degree control range while the independent deployment
        // coordinate can move continuously through the full 70 degrees.
        deflectionLiftCoeff = 0.38
        ctrlSurfaceRange = 70
        ctrlRangeFactor = 0.2
        ctrlSurfaceArea = 1
        actuatorSpeed = 20
        transformName = Flap
        aeroAuthorityLimiter = 35.714
        aeroDeployAngle = 0
        uncasedTemp = 1200
        casedTemp = 2400
    }

    MODULE
    {
        name = ModuleGridFinAuthority
        fullLiftCoefficient = 0.38
        liftAuthorityPercent = 100
        maxDeploymentDegrees = 70
        deploymentRateDegreesPerSecond = 10
        steeringAuthorityPercent = 35.714
        deploymentCommandPercent = 0
        appliedDeploymentDegrees = 0
    }

    MODULE
    {
        name = FXModuleLookAtConstraint
        CONSTRAINLOOKFX
        {
            targetName = PistonArm
            rotatorsName = PistonBase
        }
        CONSTRAINLOOKFX
        {
            targetName = PistonBase
            rotatorsName = PistonArm
        }
    }
}
