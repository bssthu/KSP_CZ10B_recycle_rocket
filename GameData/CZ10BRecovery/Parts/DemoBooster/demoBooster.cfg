PART
{
    name = CZ10B-DemoBooster
    module = Part
    author = KSP Recycle Rocket Project
    MODEL
    {
        model = Squad/Parts/FuelTank/RockomaxTanks/Assets/Rockomax64
    }
    rescaleFactor = 1
    node_stack_top = 0, 3.73, 0, 0, 1, 0, 2
    // A real stock Mainsail is attached here by the mission craft. Keeping it
    // as its own part preserves stock/Waterfall plume and ModuleSurfaceFX.
    node_stack_bottom = 0, -3.73, 0, 0, -1, 0, 2
    TechRequired = heavierRocketry
    entryCost = 45000
    cost = 22000
    category = Pods
    subcategory = 0
    title = CZ-10B Integrated Reusable First Stage
    manufacturer = Recovery Systems Laboratory
    description = A low-part-count reusable-stage tank combining guidance, propellant and four virtual catch-hook anchors. Attach a stock Mainsail directly to the bottom node so its complete plume, emissive and surface-smoke effects remain available.
    attachRules = 1,0,1,1,0
    CrewCapacity = 0
    vesselType = Probe
    // Together with the stock 6 t Mainsail, dry mass remains the former 8 t.
    mass = 2
    dragModelType = default
    maximum_drag = 0.25
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 35
    breakingForce = 500
    breakingTorque = 500
    maxTemp = 2400
    // Engine-first atmospheric return from the 15-degree ascent corridor
    // reaches roughly 1.6 km/s near 14 km.  Give the integrated reusable
    // stage the same skin system class as a stock inflatable heat shield.
    skinMaxTemp = 3500
    emissiveConstant = 0.9
    heatConductivity = 0.01
    thermalMassModifier = 7.5
    bulkheadProfiles = size2
    tags = reusable booster first stage recovery hook kos cz10b integrated

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05
        }
        hasHibernation = True
        hibernationMultiplier = 0.001
        CONTROLPOINT
        {
            name = reverse
            displayName = Reversed
            orientation = 0,0,180
        }
    }
    MODULE
    {
        name = ModuleReactionWheel
        // Represents combined grid-fin/cold-gas authority.  kOS limits this
        // to 0.625% during normal flight and releases it only for terminal coast.
        PitchTorque = 3200
        YawTorque = 3200
        RollTorque = 1600
        RESOURCE
        {
            name = ElectricCharge
            rate = 1.2
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }
    MODULE
    {
        name = ModuleCatchHook
        armed = true
        virtualHookCount = 4
        hookRadius = 1.65
        hookOffsetY = 3.0
    }
    MODULE
    {
        name = ModulePartVariants
        baseVariant = White
        VARIANT
        {
            name = White
            displayName = White Reusable Tank
            primaryColor = #ffffff
            secondaryColor = #333333
            GAMEOBJECTS
            {
                Rockomax_64_White = true
                Rockomax_64_Orange = false
            }
        }
    }
    RESOURCE
    {
        name = LiquidFuel
        amount = 5400
        maxAmount = 5400
    }
    RESOURCE
    {
        name = Oxidizer
        amount = 6600
        maxAmount = 6600
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 1200
        maxAmount = 1200
    }
}
