    // Static stowed transport clamp on the starboard-aft tower. Public sources
    // describe auxiliary ropes and automatic rigid locking but disclose no jaw
    // dimensions; these folded beams are deliberately representational.
    MODEL
    {
        model = Squad/Parts/Structural/structuralIBeam650/model
        position = 10.9, 18, 10
        scale = 0.8, 4, 0.8
        rotation = 0, 0, -12
    }
    MODEL
    {
        model = Squad/Parts/Structural/structuralIBeam650/model
        position = 13.1, 18, 10
        scale = 0.8, 4, 0.8
        rotation = 0, 0, 12
    }
    MODEL
    {
        model = Squad/Parts/Structural/structuralIBeam650/model
        position = 12, 21.8, 10
        scale = 0.8, 2.2, 0.8
        rotation = 0, 0, 90
    }
    rescaleFactor = 1
    node_stack_top = 0, 0.08, 0, 0, 1, 0, 2
    node_stack_bottom = 0, -0.08, 0, 0, -1, 0, 3
    TechRequired = specializedConstruction
    entryCost = 30000
    cost = 12000
    category = Pods
    subcategory = 0
    title = CZ-10B Integrated Recovery Platform
    manufacturer = Recovery Systems Laboratory
    description = A one-part recovery ship with a sealed lower hull, four tall cable towers, moving capture lines and a static stowed transport clamp. The functional geometry remains deliberately scaled for repeatable automated tests.
    attachRules = 1,0,1,1,0
    CrewCapacity = 0
    vesselType = Ship
    mass = 18
    dragModelType = default
    maximum_drag = 0.3
    minimum_drag = 0.2
    angularDrag = 4
    crashTolerance = 120
    breakingForce = 2000
    breakingTorque = 2000
    maxTemp = 2000
    bulkheadProfiles = size3
    tags = recovery ship platform barge cable net cz10b integrated

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.02
        }
    }
    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 200
        YawTorque = 200
        RollTorque = 200
        RESOURCE
        {
            name = ElectricCharge
            rate = 2
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }
    MODULE
    {
        name = ModuleCatchNet
        // Match the functional east-west mouth to the tower centrelines and
        // cable anchors. The former 10 m limit could reject an outer virtual
        // hook even though it was visibly still inside the 24 m-wide frame.
        halfWidth = 12
        halfLength = 10
        // The cable endpoints sit on the four top girders rather than floating
        // six metres below them. Capture bounds and visual cable anchors both
        // reach the full 24 m by 20 m frame.
        planeOffset = 30
        cableAnchorHalfWidth = 12
        cableAnchorHalfLength = 10
        // The four compliant lines sweep a shallow volume below the top frame.
        // This lets a hook that crosses at the frame edge be taken once the
        // moving cradle recentres, instead of treating the rope as a 1.5 m plate.
        detectionDepth = 6.0
        maxClosingSpeed = 7.5
        maxLateralSpeed = 4.0
        maxTilt = 15
        // A 17.32 m loaded drop over a 10 m half-span forms a 60-degree rope
        // angle.  It also leaves the first-stage nozzle above the deck.
        jointTravel = 18.5
        jointSlack = 0.75
        captureSettleDrop = 17.32
        captureSettleSpeed = 2.5
        // Active winch braking dissipates multi-line sway instead of returning
        // it to a tilted stage as a four-joint whip.
        captureLinearDamping = 3.0
        captureAngularDamping = 5.0
        spring = 65000
        damper = 28000
        maximumForce = 2000000
        openCableInset = 8.0
        // Leave visible clearance around the 1.65 m virtual hook circle even
        // when the stage retains a small residual tilt.
        closedCableInset = 2.15
        // Close in about 0.4 s once all hooks enter the guarded volume. This
        // is fast enough for the dedicated pass-through test and still leaves
        // the lines fully open until a valid target is inside the frame.
        cableClosureSpeed = 15.0
        cableTrackingSpeed = 10.0
        // Begin closing while the hook is still above the frame; this gives
        // the moving cables time to settle before the stage reaches the plane.
        closureHeight = 30
        closureHalfWidth = 12
        debugLogging = false
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 5000
        maxAmount = 5000
    }
}
