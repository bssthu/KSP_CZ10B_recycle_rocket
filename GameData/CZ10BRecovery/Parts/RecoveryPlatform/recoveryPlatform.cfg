PART
{
    name = CZ10B-RecoveryPlatform
    module = Part
    author = KSP Recycle Rocket Project
    MODEL
    {
        model = Squad/Parts/Structural/structuralPanel2x2/model
        position = -12.5, 0, 0
        scale = 2.5, 1, 15
    }
    MODEL
    {
