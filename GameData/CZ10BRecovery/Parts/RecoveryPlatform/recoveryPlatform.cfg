    {
        model = Squad/Parts/Structural/structuralPanel2x2/model
        position = 0, 0, 12.5
        scale = 15, 1, 2.5
    }
    // Four corner pontoons keep the cable deck several metres above sea level
    // while preserving the unobstructed 20 m square rocket opening.
    MODEL
    {
        model = Squad/Parts/FuelTank/RockomaxTanks/Assets/Rockomax64
        position = -12, -4, -10
    }
    MODEL
    {
        model = Squad/Parts/FuelTank/RockomaxTanks/Assets/Rockomax64
        position = 12, -4, -10
    }
    MODEL
    {
        model = Squad/Parts/FuelTank/RockomaxTanks/Assets/Rockomax64
        position = -12, -4, 10
