    MODEL
    {
        model = Squad/Parts/FuelTank/RockomaxTanks/Assets/Rockomax64
        position = 12, -4, 10
    }
    rescaleFactor = 1
    node_stack_top = 0, 0.08, 0, 0, 1, 0, 2
    node_stack_bottom = 0, -0.08, 0, 0, -1, 0, 3
    TechRequired = specializedConstruction
    entryCost = 30000
    cost = 12000
    category = Pods
    subcategory = 0
    title = CZ-10B Integrated Recovery Platform
    manufacturer = Recovery Systems Laboratory
    description = A one-part 30 m square functional test platform with command, power, reaction control and a collision-free 20 m square opening under the active cable net. Use this before building the full-scale cosmetic ship.
    attachRules = 1,0,1,1,0
    CrewCapacity = 0
    vesselType = Ship
    mass = 18
    dragModelType = default
    maximum_drag = 0.3
    minimum_drag = 0.2
    angularDrag = 4
    crashTolerance = 120
    breakingForce = 2000
    breakingTorque = 2000
    maxTemp = 2000
    bulkheadProfiles = size3
    tags = recovery ship platform barge cable net cz10b integrated

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.02
        }
    }
    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 200
        YawTorque = 200
        RollTorque = 200
        RESOURCE
        {
            name = ElectricCharge
            rate = 2
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }
    MODULE
    {
        name = ModuleCatchNet
        halfWidth = 10
        halfLength = 10
        // Raise the cable plane above the deck collision geometry so the
        // booster's upper catch hooks meet the cables before its body settles.
        planeOffset = 3.2
        detectionDepth = 1.5
        maxClosingSpeed = 7.5
        maxLateralSpeed = 4.0
        maxTilt = 15
        jointTravel = 1.5
        spring = 180000
        damper = 45000
        maximumForce = 2000000
        debugLogging = false
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 5000
        maxAmount = 5000
    }
}
